[project]
name = "cuda-transformer"
version = "0.1.0"
description = "A CUDA-based transformer model implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.0",
    "dotenv>=0.9.9",
    "pybind11>=3.0.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "torch>=2.12.0",
    "tqdm>=4.68.3",
    "transformers>=5.14.1",
    "wandb>=0.23.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
