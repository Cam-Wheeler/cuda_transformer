[project]
name = "cuda-transformer"
version = "0.1.0"
description = "A CUDA-based transformer model implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "dotenv>=0.9.9",
    "pybind11>=3.0.4",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1"
]
