# Testing Kernels.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: wheeler-test-kernels-
  labels:
    eidf/user: cwheeler-eidf220
    kueue.x-k8s.io/queue-name: eidf220ns-user-queue
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 6000
  template:
    metadata:
      labels:
        eidf/user: cwheeler-eidf220
    spec:
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-A100-SXM4-40GB"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cwheeler-data
      securityContext:
         fsGroup: 5455
      containers:
      - name: test-kernels
        image: camwheeler135/cuda_tests:v0.0.X # Replace with appropriate version number.
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          uv run --no-sync pytest /app/tests/test_elementwise_kernels.py
        resources:
          requests:
           nvidia.com/gpu: 1
           cpu: 8
           memory: 16Gi
          limits:
            nvidia.com/gpu: 1
            cpu: 8
            memory: 16Gi
        volumeMounts:
        - name: data
          mountPath: /data
      restartPolicy: Never