# CPU job for debugging, dataloading etc on the cluster.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: wheeler-cpu-job-
  labels:
    eidf/user: cwheeler-eidf220
    kueue.x-k8s.io/queue-name: eidf220ns-user-queue
    kueue.x-k8s.io/priority-class: batch-workload-priority
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 6000
  template:
    metadata:
      labels:
        eidf/user: cwheeler-eidf220
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: cwheeler-data
      securityContext:
         fsGroup: 5455
      containers:
      - name: cpu-job
        image: camwheeler135/qwen3_mini_train:v0.0.1
        imagePullPolicy: Always
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: qwen-training-secrets
              key: wandb-api-key
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: qwen-training-secrets
              key: hf-token
        command: ["/bin/bash", "-c"]
        args:
        - |
          uv run --no-sync download_and_tokenise.py --location cluster
          EXIT_CODE=$?
          echo "Fixing permissions..."
          chown -R 28853:5455 /data
          chmod -R 775 /data
          exit $EXIT_CODE
        resources:
          requests:
           nvidia.com/gpu: 0
           cpu: 8
           memory: 32Gi
          limits:
            nvidia.com/gpu: 0
            cpu: 8
            memory: 32Gi
        volumeMounts:
        - name: data
          mountPath: /data
      restartPolicy: Never
